# fly.toml app configuration file generated for omniroute-afrkultur-cd on 2026-10-27T12:12:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'omniroute-afrkultur-cd'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  HOSTNAME = '0.0.0.0'
  OMNIROUTE_MEMORY_MB = '768'
  PORT = '20128'
  TZ = 'Europe/Paris'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
