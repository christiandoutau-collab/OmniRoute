app = 'omniroute-afrkultur-cd'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile.fly'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  TZ = 'Europe/Paris'
  HOST = '0.0.0.0'
  HOSTNAME = '0.0.0.0'
  PORT = '20128'
  DATA_DIR = '/data'
  OMNIROUTE_MEMORY_MB = '768'
